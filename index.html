
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIAntoClip — Estudio IA</title>
<style>
:root {
  font-family: system-ui, sans-serif;
  color: #f5f3ff;
  background: #090b19;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(circle at top right,#34206a,#090b19 55%);
}
header,main,footer {
  max-width: 1050px;
  margin: auto;
  padding: 24px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.logo { font-size: 27px; font-weight: 850; }
.logo span,h1 span { color: #b69cff; }
h1 { font-size: clamp(36px,6vw,65px); }
p { color: #c4c4d5; line-height: 1.6; }
.panel {
  background: #171a30;
  border: 1px solid #393b5b;
  border-radius: 20px;
  padding: 24px;
  margin: 24px 0;
}
textarea,select,button {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  margin-top: 12px;
  font-size: 16px;
}
textarea,select {
  background: #101326;
  color: white;
  border: 1px solid #494b69;
}
textarea { min-height: 130px; }
button {
  background: #a58aff;
  color: #101020;
  border: none;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { opacity: .5; }
video {
  width: 100%;
  border-radius: 15px;
  margin-top: 20px;
}
#error { color: #ff9292; white-space: pre-wrap; }
#estado { color: #c4b5fd; }
</style>
</head>
<body>

<header>
  <div class="logo">MI<span>AntoClip</span></div>
  <div>Estudio IA</div>
</header>

<main>
  <h1>Crea vídeos con <span>inteligencia artificial</span></h1>
  <p>Transforma tus ideas en vídeos espectaculares.</p>

  <section class="panel">
    <h2>Generador de vídeo IA</h2>

    <textarea id="prompt" placeholder="Describe el vídeo que quieres crear..."></textarea>

    <select id="duracion">
      <option value="5">5 segundos</option>
      <option value="10">10 segundos</option>
    </select>

    <button id="generar">Generar vídeo</button>

    <p id="estado"></p>
    <p id="error"></p>
    <div id="resultado"></div>
  </section>
</main>

<footer>MIAntoClip © 2026</footer>

<script>
// PEGA AQUÍ LA URL REAL DE TU WORKER
const API_URL = "https://TU-WORKER.workers.dev";

const boton = document.getElementById("generar");
const estado = document.getElementById("estado");
const error = document.getElementById("error");
const resultado = document.getElementById("resultado");

function esperar(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function solicitar(url, opciones = {}) {
  const controlador = new AbortController();
  const temporizador = setTimeout(
    () => controlador.abort(), 30000
  );

  try {
    const respuesta = await fetch(url, {
      ...opciones,
      signal: controlador.signal
    });

    const texto = await respuesta.text();
    let datos;

    try {
      datos = JSON.parse(texto);
    } catch {
      throw new Error(
        "Respuesta no válida del servidor: " +
        texto.slice(0, 300)
      );
    }

    if (!respuesta.ok) {
      throw new Error(
        datos.error?.message ||
        datos.error ||
        datos.message ||
        "Error HTTP " + respuesta.status
      );
    }

    return datos;
  } finally {
    clearTimeout(temporizador);
  }
}

boton.addEventListener("click", async () => {
  const prompt = document.getElementById("prompt").value.trim();
  const duracion = Number(
    document.getElementById("duracion").value
  );

  if (!prompt) {
    error.textContent = "Escribe primero una descripción.";
    return;
  }

  if (API_URL.includes("TU-WORKER")) {
    error.textContent = "Configura la URL del Worker.";
    return;
  }

  boton.disabled = true;
  error.textContent = "";
  resultado.innerHTML = "";
  estado.textContent = "Enviando solicitud...";

  try {
    // El Worker debe aceptar POST /generate
    const datos = await solicitar(API_URL + "/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt, duration: duracion })
    });

    let tarea = datos;

    if (datos.id && !datos.videoUrl && !datos.url) {
      for (let intento = 0; intento < 60; intento++) {
        await esperar(5000);
        estado.textContent =
          "Generando vídeo... comprobación " + (intento + 1);

        // El Worker debe aceptar GET /status/:id
        tarea = await solicitar(
          API_URL + "/status/" + encodeURIComponent(datos.id)
        );

        if (tarea.status === "SUCCEEDED" ||
            tarea.status === "succeeded") break;

        if (["FAILED","failed","CANCELLED","canceled"]
            .includes(tarea.status)) {
          throw new Error(
            tarea.failure || tarea.error || "Generación fallida"
          );
        }
      }
    }

    const videoUrl =
      tarea.videoUrl ||
      tarea.url ||
      tarea.output?.[0] ||
      tarea.output?.url;

    if (!videoUrl || typeof videoUrl !== "string") {
      throw new Error(
        "No se recibió un vídeo terminado. Estado: " +
        (tarea.status || "desconocido")
      );
    }

    const video = document.createElement("video");
    video.controls = true;
    video.src = videoUrl;
    resultado.appendChild(video);
    estado.textContent = "¡Vídeo generado!";

  } catch (e) {
    estado.textContent = "No se pudo generar el vídeo.";
    error.textContent =
      e.name === "AbortError"
        ? "El servidor tardó demasiado en responder."
        : e.message;
  } finally {
    boton.disabled = false;
  }
});
</script>
</body>
</html>
